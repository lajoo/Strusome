<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  
  <!-- Top Right StruSoft Square Logo -->
  <rect x="930" y="0" width="150" height="150" fill="#00529B"/>
  <text x="1005" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">StruSoft</text>

  <!-- Product Logo Box -->
  <rect x="275" y="135" width="515" height="155" rx="32" fill="#FFFFFF" stroke="#00529B" stroke-width="7"/>
  <text x="315" y="222" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#00529B">+ Product logo</text>

  <!-- Headline Box -->
  <rect x="275" y="310" width="705" height="80" rx="20" fill="#FFFFFF" stroke="#00529B" stroke-width="7"/>
  <text x="315" y="358" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" fill="#00529B">+ Headline</text>

  <!-- Subtitle Box -->
  <rect x="275" y="405" width="705" height="80" rx="20" fill="#FFFFFF" stroke="#00529B" stroke-width="7"/>
  <text x="315" y="453" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" fill="#00529B">+ Subtitle</text>

  <!-- Main Image Box -->
  <rect x="275" y="505" width="805" height="460" rx="36" fill="#FFFFFF" stroke="#00529B" stroke-width="7"/>
  <text x="677" y="745" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="54" fill="#00529B" text-anchor="middle">+ Image</text>

  <!-- Background Label -->
  <text x="30" y="1030" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#00529B">+ Background</text>
</svg>
